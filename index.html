<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exit to Home</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;500;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0c10;
      --surface: #12151c;
      --border: #1e2330;
      --accent: #e8f0ff;
      --accent-glow: rgba(120, 160, 255, 0.18);
      --btn-bg: #1a1f2e;
      --btn-hover: #232a3d;
      --btn-border: #2e3a55;
      --btn-active: #0f1420;
      --text-primary: #e8eaf0;
      --text-muted: #6b7594;
    }

    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      font-family: 'DM Sans', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      user-select: none;
    }

    /* Subtle noise texture overlay */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      background-size: 200px 200px;
      pointer-events: none;
      z-index: 0;
    }

    /* Radial ambient glow */
    body::after {
      content: '';
      position: fixed;
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(60, 90, 160, 0.12) 0%, transparent 70%);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 0;
    }

    .card {
      position: relative;
      z-index: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 64px 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 40px;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.03) inset,
        0 40px 80px rgba(0,0,0,0.5);
      animation: fadeUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .icon {
      width: 64px; height: 64px;
      opacity: 0.55;
    }

    .label {
      text-align: center;
    }

    .label h1 {
      font-size: 2rem;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.5px;
      margin-bottom: 10px;
    }

    .label p {
      font-size: 1rem;
      font-weight: 300;
      color: var(--text-muted);
      letter-spacing: 0.01em;
    }

    /* Exit button */
    #exitBtn {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: var(--btn-bg);
      border: 1px solid var(--btn-border);
      border-radius: 16px;
      color: var(--text-primary);
      font-family: 'DM Sans', sans-serif;
      font-size: 1.25rem;
      font-weight: 500;
      letter-spacing: 0.01em;
      padding: 22px 56px;
      cursor: pointer;
      outline: none;
      transition:
        background 0.15s ease,
        border-color 0.15s ease,
        box-shadow 0.15s ease,
        transform 0.12s ease;
      box-shadow: 0 4px 24px rgba(0,0,0,0.3);
      min-width: 280px;
    }

    #exitBtn::before {
      content: '';
      position: absolute; inset: 0;
      border-radius: inherit;
      background: linear-gradient(135deg, rgba(255,255,255,0.04) 0%, transparent 60%);
      pointer-events: none;
    }

    #exitBtn svg {
      flex-shrink: 0;
      transition: transform 0.2s ease;
    }

    #exitBtn:hover, #exitBtn:focus {
      background: var(--btn-hover);
      border-color: rgba(120, 160, 255, 0.35);
      box-shadow:
        0 0 0 3px rgba(100, 140, 255, 0.12),
        0 8px 32px rgba(0,0,0,0.4);
      transform: translateY(-2px);
    }

    #exitBtn:hover svg {
      transform: scale(1.12);
    }

    #exitBtn:active {
      background: var(--btn-active);
      transform: translateY(1px) scale(0.98);
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }

    /* Ripple */
    .ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(120, 160, 255, 0.2);
      transform: scale(0);
      animation: ripple 0.5s linear;
      pointer-events: none;
    }
    @keyframes ripple {
      to { transform: scale(4); opacity: 0; }
    }

    /* Status feedback */
    #status {
      font-size: 0.85rem;
      color: var(--text-muted);
      letter-spacing: 0.03em;
      min-height: 20px;
      transition: opacity 0.3s;
    }
  </style>
</head>
<body>
  <div class="card">

    <!-- Home icon -->
    <svg class="icon" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M8 28L32 8L56 28V56H40V40H24V56H8V28Z"
        stroke="#7890c8" stroke-width="3" stroke-linejoin="round" fill="rgba(100,130,200,0.08)"/>
    </svg>

    <div class="label">
      <h1>Return to Home</h1>
      <p>Exit the browser and go back to the TV launcher</p>
    </div>

    <button id="exitBtn" onclick="exitToHome(event)">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <polyline points="16 17 21 12 16 7"/>
        <line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
      Exit to Home Screen
    </button>

    <div id="status"></div>
  </div>

  <script>
    function exitToHome(event) {
      // Ripple effect
      const btn = document.getElementById('exitBtn');
      const ripple = document.createElement('span');
      ripple.className = 'ripple';
      const rect = btn.getBoundingClientRect();
      const size = Math.max(rect.width, rect.height);
      ripple.style.width = ripple.style.height = size + 'px';
      ripple.style.left = (event.clientX - rect.left - size / 2) + 'px';
      ripple.style.top  = (event.clientY - rect.top  - size / 2) + 'px';
      btn.appendChild(ripple);
      ripple.addEventListener('animationend', () => ripple.remove());

      const status = document.getElementById('status');

      // Try Fully Kiosk Browser JS interface
      if (typeof fully !== 'undefined' && typeof fully.exitApp === 'function') {
        status.textContent = 'Returning to home…';
        setTimeout(() => fully.exitApp(), 200);
      }
      // Fallback: try Android intent URL (works in some WebViews)
      else if (isAndroid()) {
        status.textContent = 'Attempting home intent…';
        window.location.href =
          'intent://#Intent;action=android.intent.action.MAIN;' +
          'category=android.intent.category.HOME;end';
      }
      else {
        status.textContent = '⚠ Fully Kiosk API not detected. Are you in Fully Kiosk Browser?';
        setTimeout(() => { status.textContent = ''; }, 4000);
      }
    }

    function isAndroid() {
      return /android/i.test(navigator.userAgent);
    }

    // Remote control / TV: allow Enter key on button
    document.getElementById('exitBtn').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        exitToHome({ clientX: 0, clientY: 0 });
      }
    });
  </script>
</body>
</html>
